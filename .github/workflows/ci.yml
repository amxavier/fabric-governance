
# Validates that all expected Fabric artifacts exist in the repository
# and runs Python tests against the Semantic Model, Report, and Bronze
# notebook definitions. Runs on every push to catch missing or
# misconfigured objects early.
name: CI - Validate Fabric Artifacts

on:
  push:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Fabric artifact structure
        run: |
          echo "Validating Fabric artifacts..."

          # Fixed top-level items (one of each, not expected to grow).
          required=(
            "lh_governance_bronze.Lakehouse"
            "lh_governance_silver.Lakehouse"
            "lh_governance_gold.Lakehouse"
            "pipelines/pl_governance_orchestration.DataPipeline"
            "semantic models/sm_governance_medallion.SemanticModel"
            "report/rpt_governance_dashboard.Report"
          )

          for artifact in "${required[@]}"; do
            if [ ! -d "$artifact" ]; then
              echo "MISSING: $artifact"
              exit 1
            else
              echo "OK: $artifact"
            fi
          done

          # Notebooks: structural check on every *.Notebook folder instead of
          # a hardcoded name list — a fixed list silently drifts as notebooks
          # are added (this one did: 11 names hardcoded here while 22
          # notebooks existed in the repo, so CI was never actually
          # validating most of them). Every notebook needs both files to be
          # deployable at all, so this still catches real breakage.
          notebook_count=0
          for nb in notebooks/*.Notebook; do
            notebook_count=$((notebook_count + 1))
            for f in ".platform" "notebook-content.py"; do
              if [ ! -f "$nb/$f" ]; then
                echo "MISSING: $nb/$f"
                exit 1
              fi
            done
            echo "OK: $nb"
          done
          echo "Validated $notebook_count notebooks."

          echo "All artifacts validated successfully."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run Semantic Model, Report, and Bronze SCD tests
        run: pytest tests/ -v
