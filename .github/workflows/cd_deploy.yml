# Deploys Fabric artifacts directly to the target workspace via REST API.
# Triggered when "CI - Validate Fabric Artifacts" succeeds on dev, qa, or main
# — each branch maps to its own workspace via config/valueSets/{branch}.json.
# No Git Integration or Deployment Pipeline needed.
#
# Deliberately NOT triggered directly on push: that let a commit failing CI
# (missing artifact, broken test) deploy to a live workspace before or
# alongside CI reporting the failure, since the two workflows ran in
# parallel with no ordering between them. Gating on workflow_run means a
# broken commit never reaches Fabric.
name: CD - Deploy to Fabric

on:
  workflow_run:
    workflows: ["CI - Validate Fabric Artifacts"]
    types: [completed]
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deploy mode"
        required: false
        default: "selective"
        type: choice
        options:
          - selective
          - full

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run doesn't default to the commit CI validated — pin it
          # explicitly. Falls back to the normal ref for workflow_dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2  # needed for git diff HEAD~1 in selective mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy artifacts
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || 'selective' }}
          # GITHUB_REF_NAME is auto-set by the runner to the *workflow file's
          # own* ref for workflow_run events — always the default branch,
          # regardless of which branch's CI run actually triggered this —
          # and can't be overridden by setting it here (confirmed live
          # 2026-08-07, twice: a dev-branch CI success deployed dev's own
          # commits against PRD's workspace_id both before AND after trying
          # exactly this override; GITHUB_REF_NAME never changed). Use a
          # different variable instead — deploy.py now checks BRANCH_NAME
          # ahead of GITHUB_REF_NAME for exactly this reason.
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: python scripts/deploy.py
